[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sipl-toolkit"
version = "0.3.0"
description = "Інструменти для навчальної мови SIPL: граматика, парсер, AST, інтерпретатор, семантичні терми"
readme = "docs/README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["lark>=1.1,<2"]

[project.scripts]
sipl = "sipl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/sipl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
